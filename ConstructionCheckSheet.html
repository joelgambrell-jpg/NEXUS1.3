<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Construction Check Sheet</title>

<style>
  :root{
    --bg:#b60000;
    --panel:rgba(255,255,255,0.20);
    --panel2:rgba(0,0,0,0.35);
    --line:rgba(255,255,255,0.22);
    --btn-bg:#0a0f24;
    --btn-txt:#3ecbff;
    --accent:#00c2ff;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; font-family:Arial,Helvetica,sans-serif; color:#fff; background:var(--bg); }
  body{
    background-image:url("transformer.jpg");
    background-repeat:no-repeat;
    background-position:center center;
    background-size:cover;
    background-attachment:fixed;
  }

  /* Header */
  .nx-header-wrap{
    background: rgba(0,0,0,0.35);
    border-bottom: 1px solid rgba(255,255,255,0.18);
    backdrop-filter: blur(8px);
  }
  .nx-header{
    max-width: 1100px;
    margin: 0 auto;
    padding: 14px 18px;
    display: flex;
    align-items: center;
  }
  .nx-header img{ height: 54px; width:auto; object-fit:contain; }

  .wrap{ max-width:1100px; margin: 22px auto 60px; padding: 0 18px; }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    margin: 10px 0 14px;
  }
  .backlink{ color:#fff; text-decoration:none; font-weight:900; opacity:.95; }

  .title{
    text-align:center;
    margin: 8px 0 10px;
    font-size: 38px;
    font-weight: 900;
    text-shadow: 0 4px 18px rgba(0,0,0,.35);
  }
  .sub{
    text-align:center;
    font-size: 20px;
    font-weight: 900;
    margin: 0 0 18px;
    opacity: .98;
  }

  .card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 18px;
    backdrop-filter: blur(8px);
  }

  .actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin: 8px 0 14px;
  }
  .btn{
    padding:12px 16px;
    font-size:15px;
    font-weight:900;
    border-radius:999px;
    color:var(--btn-txt);
    background:var(--btn-bg);
    border:2px solid var(--accent);
    cursor:pointer;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    user-select:none;
  }
  .btn.secondary{
    background: rgba(0,0,0,0.22);
    color:#fff;
    border:2px solid rgba(255,255,255,0.35);
  }

  .meta-grid{
    display:grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    margin: 10px 0 12px;
  }
  @media (max-width:900px){ .meta-grid{ grid-template-columns:1fr; } }

  .field{
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px;
    text-align:left;
  }
  .label{
    font-size: 12px;
    font-weight: 900;
    letter-spacing: .12em;
    text-transform: uppercase;
    opacity: .95;
    margin-bottom: 8px;
  }
  input[type="text"], select{
    width:100%;
    padding: 12px 12px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.18);
    outline:none;
    font-size: 16px;
    font-weight: 900;
    background: rgba(255,255,255,0.92);
    color:#111;
  }

  .status{ margin: 8px 0 10px; font-weight: 900; opacity: .95; }

  .table-wrap{
    overflow-x:auto;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(0,0,0,0.22);
  }
  table{ width:100%; border-collapse: collapse; min-width: 860px; }
  th, td{ padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.14); vertical-align: top; }
  th{
    text-align:left;
    font-size: 12px;
    letter-spacing: .12em;
    text-transform: uppercase;
    opacity: .95;
    background: rgba(0,0,0,0.22);
    position: sticky;
    top: 0;
    z-index: 2;
  }
  tr.section-row td{
    background: rgba(255,255,255,0.10);
    font-weight: 900;
    letter-spacing: .02em;
  }

  .cell-input{
    width: 100%;
    min-width: 120px;
    padding: 10px 10px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.18);
    outline:none;
    font-weight: 900;
    background: rgba(255,255,255,0.92);
    color:#111;
  }
  .cell-notes{ min-width: 260px; }

  @media print{
    body{ background:#fff !important; color:#000 !important; }
    .nx-header-wrap, .actions, .topbar{ display:none !important; }
    .card{ background:#fff !important; border:none !important; backdrop-filter:none !important; }
    th{ color:#000 !important; background:#eee !important; }
    .table-wrap{ border:1px solid #ccc !important; background:#fff !important; }
    .cell-input{ border:1px solid #999 !important; background:#fff !important; color:#000 !important; }
  }
</style>
</head>

<body>
<div class="nx-header-wrap"><div class="nx-header"><img src="nexus.png" alt="NEXUS" /></div></div>

<div class="wrap">
  <div class="topbar">
    <a class="backlink" id="backToEquipment" href="equipment.html">← Back to Equipment</a>
    <div style="font-weight:900;opacity:.9" id="nowStamp"></div>
  </div>

  <div class="title">Construction Check Sheet</div>
  <div class="sub" id="eqSub">Equipment: (missing eq)</div>

  <div class="card">
    <div class="actions">
      <button class="btn secondary" id="btnSave" type="button">Save</button>
      <button class="btn secondary" id="btnExport" type="button">Export (Print/PDF)</button>
    </div>

    <div class="meta-grid">
      <div class="field">
        <div class="label">Building</div>
        <input id="building" type="text" placeholder="Building #" />
      </div>

      <div class="field">
        <div class="label">Phase</div>
        <select id="phase">
          <option value="">Select…</option>
          <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option>
          <option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option>
        </select>
      </div>

      <div class="field">
        <div class="label">Pod</div>
        <select id="pod">
          <option value="">Select…</option>
          <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option>
          <option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option>
        </select>
      </div>

      <div class="field" style="grid-column:1 / -1;">
        <div class="label">Foreman</div>
        <input id="foreman" type="text" placeholder="Foreman name" />
      </div>
    </div>

    <div class="status" id="saveStatus">Not saved</div>

    <div class="table-wrap">
      <table id="sheetTable" aria-label="Construction Check Sheet">
        <thead>
          <tr>
            <th style="width:44%;">Item</th>
            <th style="width:16%;">Date</th>
            <th style="width:12%;">Initials</th>
            <th style="width:28%;">Notes</th>
          </tr>
        </thead>
        <tbody id="sheetBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
(function(){
  const qs = new URLSearchParams(location.search);
  const eq = (qs.get("eq") || "").trim();

  document.getElementById("nowStamp").textContent = new Date().toLocaleString();
  document.getElementById("eqSub").textContent = eq ? `Equipment: ${eq}` : "Equipment: (missing eq)";

  const back = document.getElementById("backToEquipment");
  back.href = eq ? `equipment.html?eq=${encodeURIComponent(eq)}` : "equipment.html";

  const KEY = `nexus_${eq || "NO_EQ"}_construction_check_sheet_v1`;

  const rows = [
    {type:"section", text:"LV Transformer 001"},
    {type:"row", text:"RIF Completed"},
    {type:"row", text:"Labels installed by QCX"},
    {type:"row", text:"Phenolic"},
    {type:"row", text:"Arc Flash"},
    {type:"row", text:"Torque (all lugs verified)"},
    {type:"row", text:"Megohmmeter test complete (if applicable)"},
    {type:"row", text:"Verification photo captured"},
    {type:"row", text:"Clean / no debris / covers installed"},
    {type:"row", text:"Final visual inspection complete"},
  ];

  const body = document.getElementById("sheetBody");

  function makeInput(className){
    const i = document.createElement("input");
    i.type = "text";
    i.className = "cell-input " + (className || "");
    return i;
  }

  function render(){
    body.innerHTML = "";
    rows.forEach((r, idx) => {
      if (r.type === "section"){
        const tr = document.createElement("tr");
        tr.className = "section-row";
        const td = document.createElement("td");
        td.colSpan = 4;
        td.textContent = r.text;
        tr.appendChild(td);
        body.appendChild(tr);
        return;
      }

      const tr = document.createElement("tr");

      const tdItem = document.createElement("td");
      tdItem.textContent = r.text;
      tdItem.style.fontWeight = "900";
      tr.appendChild(tdItem);

      const tdDate = document.createElement("td");
      const date = makeInput("");
      date.placeholder = "MM/DD/YYYY";
      date.dataset.k = `r${idx}_date`;
      tdDate.appendChild(date);
      tr.appendChild(tdDate);

      const tdInit = document.createElement("td");
      const init = makeInput("");
      init.placeholder = "AB";
      init.dataset.k = `r${idx}_init`;
      tdInit.appendChild(init);
      tr.appendChild(tdInit);

      const tdNotes = document.createElement("td");
      const notes = makeInput("cell-notes");
      notes.placeholder = "Notes";
      notes.dataset.k = `r${idx}_notes`;
      tdNotes.appendChild(notes);
      tr.appendChild(tdNotes);

      body.appendChild(tr);
    });
  }

  function collect(){
    const out = {
      eq,
      building: document.getElementById("building").value || "",
      phase: document.getElementById("phase").value || "",
      pod: document.getElementById("pod").value || "",
      foreman: document.getElementById("foreman").value || "",
      fields: {},
      updatedAt: new Date().toISOString()
    };
    document.querySelectorAll("[data-k]").forEach(el => {
      out.fields[el.dataset.k] = el.value || "";
    });
    return out;
  }

  function apply(data){
    if (!data) return;
    document.getElementById("building").value = data.building || "";
    document.getElementById("phase").value = data.phase || "";
    document.getElementById("pod").value = data.pod || "";
    document.getElementById("foreman").value = data.foreman || "";
    const fields = data.fields || {};
    document.querySelectorAll("[data-k]").forEach(el => {
      el.value = fields[el.dataset.k] || "";
    });
  }

  function setStatus(txt){
    document.getElementById("saveStatus").textContent = txt;
  }

  async function save(){
    const data = collect();
    localStorage.setItem(KEY, JSON.stringify(data));
    setStatus("Saved");

    // OPTIONAL Firebase hook (safe if not configured yet)
    try{
      if (window.nexusFirebase && typeof window.nexusFirebase.saveSheet === "function"){
        await window.nexusFirebase.saveSheet(eq, "construction", data);
        setStatus("Saved (Firebase)");
      }
    }catch(e){
      setStatus("Saved (local) — Firebase not connected");
    }
  }

  function load(){
    const raw = localStorage.getItem(KEY);
    if (!raw) return;
    try{ apply(JSON.parse(raw)); setStatus("Loaded"); }catch(e){}
  }

  document.getElementById("btnSave").addEventListener("click", save);
  document.getElementById("btnExport").addEventListener("click", () => window.print());

  render();
  load();

  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t && (t.matches("input") || t.matches("select"))) setStatus("Not saved");
  });
})();
</script>
</body>
</html>

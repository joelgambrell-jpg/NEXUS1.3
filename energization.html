<!-- =========================
     energization.html (UI label: Commissioning)
     - Matches equipment page look
     - Simple progress bar 0–100%
     - Buttons: MOP / SOP / Documents
     ========================= -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Commissioning</title>

<style>
  :root{
    --bg:#b60000;
    --panel:rgba(255,255,255,0.25);
    --btn-bg:#ffffffdd;
    --btn-color:#000;
    --btn-hover-bg:#fff;
    --btn-hover-color:#b60000;
  }
  html,body{ margin:0; font-family:Arial,Helvetica,sans-serif; color:#fff; background:var(--bg); }
  .page-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px; }
  main.container{
    width:100%; max-width:960px; background:var(--panel); padding:28px; border-radius:18px;
    backdrop-filter: blur(6px); text-align:center;
  }
  h1{ margin:0 0 8px; font-size:34px; }
  .eq{ font-size:20px; font-weight:900; margin:0 0 18px; }
  .back{ display:inline-block; color:#fff; text-decoration:none; font-weight:900; margin:0 0 10px; }

  .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
  .btn{
    width:100%; height:60px; background:var(--btn-bg); color:var(--btn-color);
    border:2px solid #ff0000; border-radius:12px; font-size:15px; font-weight:700;
    cursor:pointer; display:inline-flex; justify-content:center; align-items:center;
    text-decoration:none; transition:0.2s; box-shadow:0 0 12px #ff0000;
  }
  .btn:hover{ background:var(--btn-hover-bg); color:var(--btn-hover-color); transform:translateY(-2px); }
  .btn.complete{
    background:#00ff66 !important;
    color:#002b14 !important;
    border-color:#00ff66 !important;
    box-shadow:0 0 14px rgba(0,255,102,.85) !important;
  }

  .progress-wrap{ margin:10px 0 18px; text-align:left; }
  .progress-label{
    font-weight:900;
    margin:0 0 8px;
    display:flex; justify-content:space-between; gap:10px;
  }
  .progress-track{
    width:100%; height:16px;
    border-radius:999px;
    background:rgba(0,0,0,0.28);
    border:1px solid rgba(255,255,255,0.22);
    overflow:hidden;
  }
  .progress-fill{
    height:100%; width:0%;
    background:#00ff66;
    box-shadow:0 0 12px rgba(0,255,102,.75);
    transition:width .25s ease;
  }
</style>
</head>

<body>
<div class="page-wrap">
<main class="container">

  <a class="back" id="backLink" href="equipment.html">← Back to Equipment</a>

  <h1>Commissioning</h1>
  <div class="eq" id="eqLabel"></div>

  <div class="progress-wrap">
    <div class="progress-label">
      <div id="progressText">Progress: 0%</div>
      <div id="progressCount">0/0</div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="grid">
    <a class="btn" id="mopBtn" href="#">MOP</a>
    <a class="btn" id="sopBtn" href="#">SOP</a>
    <a class="btn" id="docsBtn" href="#">Documents</a>
  </div>

</main>
</div>

<script>
  const qs = new URLSearchParams(location.search);
  const eq = (qs.get('eq') || '').trim();

  document.title = eq ? `Commissioning ${eq}` : 'Commissioning';
  document.getElementById('eqLabel').textContent = eq ? `Equipment: ${eq}` : 'Missing equipment ID (eq)';

  const back = document.getElementById('backLink');
  back.href = eq ? `equipment.html?eq=${encodeURIComponent(eq)}` : 'equipment.html';

  function stepKey(stepId){
    return `nexus_${eq || 'NO_EQ'}_commission_${stepId}`;
  }

  const steps = [
    { stepId: 'mop',  btnId: 'mopBtn',  href: 'task.html?id=mop' },
    { stepId: 'sop',  btnId: 'sopBtn',  href: 'task.html?id=sop' },
    { stepId: 'docs', btnId: 'docsBtn', href: 'task.html?id=commission_docs' },
  ];

  // Default links (you can later point these to dedicated pages)
  steps.forEach(s => {
    const el = document.getElementById(s.btnId);
    if (!el) return;
    el.href = eq ? `${s.href}&eq=${encodeURIComponent(eq)}` : s.href;
  });

  const fill = document.getElementById('progressFill');
  const txt  = document.getElementById('progressText');
  const cnt  = document.getElementById('progressCount');

  function refresh(){
    const total = steps.length;
    let done = 0;

    steps.forEach(s => {
      const el = document.getElementById(s.btnId);
      const ok = localStorage.getItem(stepKey(s.stepId)) === '1';
      if (el) el.classList.toggle('complete', ok);
      if (ok) done++;
    });

    const pct = total ? Math.round((done / total) * 100) : 0;
    fill.style.width = `${pct}%`;
    txt.textContent = `Progress: ${pct}%`;
    cnt.textContent = `${done}/${total}`;
  }

  refresh();
  window.addEventListener('focus', refresh);
  window.addEventListener('pageshow', refresh);
  window.addEventListener('storage', refresh);
</script>
</body>
</html>

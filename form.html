<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Form</title>

<style>
/* =========================
   GLOBAL PAGE STYLES
========================= */
body{
  margin:0;
  padding:0;
  font-family:Arial, sans-serif;
  color:#fff;
  background:#b60000;
  background-image:url("transformer.jpg");
  background-repeat:no-repeat;
  background-position:center center;
  background-size:cover;
  background-attachment:fixed;
}

/* =========================
   LAYOUT
========================= */
.container{
  max-width:900px;
  margin:40px auto;
  background:rgba(255,255,255,0.20);
  padding:30px;
  border-radius:18px;
  backdrop-filter:blur(6px);
  text-align:center;
}

h1{
  font-size:32px;
  font-weight:700;
  margin-top:0;
}

.section-title{
  font-size:22px;
  font-weight:bold;
  margin:20px 0 8px;
  border-bottom:2px solid #fff;
  padding-bottom:6px;
}

.eq-label{
  font-weight:900;
  margin:10px 0 18px;
  font-size:18px;
}

/* =========================
   BUTTON PANEL
========================= */
.button-panel{
  display:inline-block;
  background: rgba(80, 80, 80, 0.65);
  padding: 34px 54px;
  border-radius: 24px;
  backdrop-filter: blur(4px);
}

.btn{
  display:block;
  margin:18px auto;
  padding:16px 50px;
  font-size:22px;
  font-weight:700;
  border-radius:999px;
  text-decoration:none;
  color:#3ecbff;
  background:#0a0f24;
  border:2px solid #00c2ff;
  cursor:pointer;
}

.btn:hover{ transform:translateY(-2px); }

.btn.complete{
  background:#00ff66 !important;
  color:#002b14 !important;
  border-color:#00ff66 !important;
  box-shadow:0 0 14px rgba(0,255,102,.85);
}

/* =========================
   🔒 CRITICAL FIX
   Prevent Step Complete flash
========================= */
#stepCompleteBtn{
  display:none !important;
}

/* =========================
   MEDIA / EMBEDS
========================= */
.media{ margin-top:20px; }
.embed{
  width:100%;
  height:75vh;
  border:none;
  border-radius:12px;
  background:#111;
}

/* =========================
   HEADER / FOOTER
========================= */
.nx-header-wrap{
  background: rgba(0,0,0,0.35);
  border-bottom: 1px solid rgba(255,255,255,0.18);
  backdrop-filter: blur(8px);
}
.nx-header{
  max-width: 1100px;
  margin: 0 auto;
  padding: 14px 18px;
  display: flex;
  align-items: center;
}
.nx-header img{
  height: 54px;
  width: auto;
  object-fit: contain;
}

.nx-footer{
  margin-top: 40px;
  padding: 18px 12px;
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  color: rgba(255,255,255,0.85);
  background: rgba(0,0,0,0.35);
  border-top: 1px solid rgba(255,255,255,0.18);
}
</style>

<link rel="stylesheet" href="assets/css/nexus-core.css">
</head>

<body>

<!-- SESSION BANNER -->
<div id="nxSessionBanner" class="nx-session-banner">
  <div class="nx-left">
    <span class="nx-pill">Equipment: <span data-nx-eq>(none)</span></span>
    <span class="nx-pill">Role: <span data-nx-role>viewer</span></span>
    <span class="nx-pill" data-nx-status>Ready</span>
  </div>
  <div class="nx-right">
    <label style="font-weight:800;font-size:12px;">
      Set Role
      <select id="nxRoleSelect" onchange="NEXUS.setRole(this.value)">
        <option value="viewer">viewer</option>
        <option value="tech">tech</option>
        <option value="foreman">foreman</option>
        <option value="superintendent">superintendent</option>
        <option value="admin">admin</option>
      </select>
    </label>
  </div>
</div>

<a class="nx-back-btn" href="#" onclick="return NEXUS_back();">← Back</a>

<!-- HEADER -->
<div class="nx-header-wrap">
  <div class="nx-header">
    <img src="nexus.png" alt="NEXUS" />
  </div>
</div>

<!-- MAIN -->
<div class="container">

  <h1 id="page-title">Loading…</h1>
  <div id="eqLabel" class="eq-label"></div>
  <div id="section-title" class="section-title"></div>

  <div id="buttonsWrap" class="button-panel">
    <div id="buttons"></div>

    <!-- 🔒 HARD-STOP BUTTON (NO FLASH) -->
    <button
      id="stepCompleteBtn"
      class="btn"
      type="button"
      style="display:none"
      hidden>
      Step Complete
    </button>
  </div>

  <div id="media" class="media" style="display:none;"></div>
</div>

<!-- LOAD CONFIG + APP -->
<script src="forms.js"></script>
<script src="app.js"></script>

<!-- EQ BACK LINK PATCH -->
<script>
(function () {
  const qs = new URLSearchParams(location.search);
  const eq = (qs.get("eq") || "").trim();

  const label = document.getElementById("eqLabel");
  if (label) label.textContent = eq ? `Equipment: ${eq}` : "";

  document.querySelectorAll("a[href]").forEach(a=>{
    try{
      const u=new URL(a.getAttribute("href"),location.href);
      if(u.origin===location.origin){
        u.searchParams.set("eq",eq);
        a.href=u.toString();
      }
    }catch(e){}
  });
})();
</script>

<script>
(function(){
  window.NEXUS_back = function(){
    const qs=new URLSearchParams(location.search);
    const eq=qs.get("eq");
    location.href = eq ? `equipment.html?eq=${encodeURIComponent(eq)}` : "equipment.html";
    return false;
  };
})();
</script>

<footer class="nx-footer">
  © 2026 NEXUS Data Science — Built for ACE Electric — All Rights Reserved
</footer>

<script src="assets/js/nexus-core.js"></script>
<script src="assets/js/nexus-firebase-bridge.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Redirecting…</title>
  <style>
    body{ margin:0; font-family:Arial; background:#b60000; color:#fff; }
  </style>
</head>
<body>
<script>
  const qs = new URLSearchParams(location.search);
  const eq = (qs.get("eq") || "").trim();
  const u = new URL("ConstructionCheckSheet.html", location.href);
  if (eq) u.searchParams.set("eq", eq);
  location.replace(u.pathname.split("/").pop() + u.search);
</script>
</body>
</html>

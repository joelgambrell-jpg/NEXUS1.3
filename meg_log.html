<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Megohmmeter Test Log</title>

<style>
  :root{--bg:#b60000;--panel:rgba(255,255,255,0.20);--line:rgba(255,255,255,0.20);--accent:#00c2ff;--btn-bg:#0a0f24;--btn-txt:#3ecbff;--ok:#00ff66;}
  *{box-sizing:border-box}
  html,body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#fff;background:var(--bg)}
  body{background-image:url("transformer.jpg");background-repeat:no-repeat;background-position:center center;background-size:cover;background-attachment:fixed}
  .nx-header-wrap{background:rgba(0,0,0,0.35);border-bottom:1px solid rgba(255,255,255,0.18);backdrop-filter:blur(8px)}
  .nx-header{max-width:1100px;margin:0 auto;padding:14px 18px;display:flex;align-items:center}
  .nx-header img{height:54px;width:auto}
  .container{max-width:980px;margin:28px auto;padding:22px;border-radius:18px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px)}
  h1{margin:0 0 6px;font-size:30px;font-weight:900}
  .sub{font-weight:900;opacity:.95;margin:0 0 12px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:820px){.row{grid-template-columns:1fr}}
  label{display:block;font-weight:900;margin:10px 0 6px;font-size:13px}
  input,select,textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,0.22);font-weight:800}
  textarea{min-height:90px}
  table{width:100%;border-collapse:separate;border-spacing:0;border-radius:14px;background:rgba(0,0,0,0.18)}
  th,td{padding:10px;border-bottom:1px solid rgba(255,255,255,0.14)}
  tr:last-child td{border-bottom:none}
  .btns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .btn{padding:12px 16px;font-weight:900;border-radius:999px;color:var(--btn-txt);background:var(--btn-bg);border:2px solid var(--accent);cursor:pointer}
  .btn.secondary{background:rgba(0,0,0,0.20);color:#fff;border:2px solid rgba(255,255,255,0.35)}
  .chip{display:inline-flex;align-items:center;padding:8px 12px;border-radius:999px;font-weight:900;font-size:13px;background:rgba(0,0,0,0.18)}
  .ok{color:var(--ok)}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
</style>

<link rel="stylesheet" href="assets/css/nexus-core.css">
</head>

<body>

<a class="nx-back-btn" href="#" onclick="return NEXUS_back();">← Back</a>

<div class="nx-header-wrap">
  <div class="nx-header">
    <img src="nexus.png" alt="NEXUS" />
  </div>
</div>

<div class="container">
  <div class="topbar">
    <div>
      <h1>Megohmmeter Test Log</h1>
      <div class="sub" id="eqLabel"></div>
    </div>
    <div class="chip" id="statusChip">Not saved</div>
  </div>

  <div class="row">
    <div>
      <label>Test Date</label>
      <input type="date" id="testDate" />
    </div>
    <div>
      <label>Technician</label>
      <input type="text" id="tech" placeholder="Name" />
    </div>
  </div>

  <label>Notes</label>
  <textarea id="notes"></textarea>

  <!-- tables unchanged -->

  <div class="btns">
    <button class="btn" id="saveBtn" type="button">Save</button>
    <a class="btn secondary" href="#" onclick="return NEXUS_back();">Back to Equipment</a>
  </div>
</div>

<script>
(function(){
  const qs = new URLSearchParams(location.search);
  const eq = qs.get("eq") || "";
  const statusChip = document.getElementById("statusChip");

  document.getElementById("eqLabel").textContent =
    eq ? `Equipment: ${eq}` : "Missing equipment ID";

  let isDirty = false;

  document.addEventListener("input", () => {
    isDirty = true;
    statusChip.textContent = "Not saved";
  }, true);

  window.NEXUS_back = function(){
    if(isDirty){
      if(!confirm("You have unsaved changes. Leave anyway?")) return false;
    }
    location.href = eq
      ? `equipment.html?eq=${encodeURIComponent(eq)}`
      : "equipment.html";
    return false;
  };

  document.getElementById("saveBtn").addEventListener("click", () => {
    isDirty = false;
    statusChip.innerHTML = '<span class="ok">Saved</span>';
  });
})();
</script>

<footer class="nx-footer">
  © 2026 NEXUS Data Science — Built for ACE Electric — All Rights Reserved
</footer>

<script src="assets/js/nexus-core.js"></script>
<script src="assets/js/nexus-firebase-bridge.js"></script>

</body>
</html>

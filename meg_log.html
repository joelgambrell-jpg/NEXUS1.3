<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Megohmmeter Test Log</title>
<style>
  :root{--bg:#b60000;--panel:rgba(255,255,255,0.20);--line:rgba(255,255,255,0.20);--accent:#00c2ff;--btn-bg:#0a0f24;--btn-txt:#3ecbff;--ok:#00ff66;}
  *{box-sizing:border-box}
  html,body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#fff;background:var(--bg)}
  body{background-image:url("transformer.jpg");background-repeat:no-repeat;background-position:center center;background-size:cover;background-attachment:fixed}
  .nx-header-wrap{background:rgba(0,0,0,0.35);border-bottom:1px solid rgba(255,255,255,0.18);backdrop-filter:blur(8px)}
  .nx-header{max-width:1100px;margin:0 auto;padding:14px 18px;display:flex;align-items:center}
  .nx-header img{height:54px;width:auto;max-width:100%;object-fit:contain}
  .container{max-width:980px;margin:28px auto;padding:22px;border-radius:18px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px)}
  h1{margin:0 0 6px;font-size:30px;font-weight:900}
  .sub{font-weight:900;opacity:.95;margin:0 0 12px}
  .chip{display:inline-flex;gap:8px;align-items:center;padding:8px 12px;border-radius:999px;background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.2);font-weight:900}
  .ok{color:var(--ok)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:820px){.row{grid-template-columns:1fr}}
  label{display:block;font-weight:900;margin:10px 0 6px;font-size:13px;letter-spacing:.02em}
  input,textarea,select{
    width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.2);
    outline:none;font-size:14px;font-weight:800;background:rgba(255,255,255,0.92);color:#111
  }
  textarea{min-height:84px;resize:vertical}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:820px){.grid2{grid-template-columns:1fr}}
  .tableWrap{margin-top:12px;background:rgba(0,0,0,0.18);border:1px solid rgba(255,255,255,0.18);border-radius:14px;padding:12px;overflow:auto}
  table{width:100%;border-collapse:collapse;min-width:760px}
  th,td{border:1px solid rgba(255,255,255,0.18);padding:10px 10px;font-size:13px;vertical-align:top}
  th{background:rgba(0,0,0,0.25);text-align:left;font-weight:900}
  .btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
  .btn{padding:12px 16px;font-size:14px;font-weight:900;border-radius:999px;color:var(--btn-txt);background:var(--btn-bg);border:2px solid var(--accent);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
  .btn.secondary{background:rgba(0,0,0,0.20);color:#fff;border:2px solid rgba(255,255,255,0.35)}
  .btn:disabled{opacity:.55;cursor:not-allowed}
</style>
<link rel="stylesheet" href="assets/css/nexus-core.css">
</head>

<body>

<div class="nx-header-wrap">
  <div class="nx-header"><img src="nexus.png" alt="NEXUS" /></div>
</div>

<div class="container">
  <h1 id="titleH1">Megohmmeter Test Log</h1>
  <div class="sub" id="eqLabel">Equipment: (missing eq)</div>

  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between">
    <div class="chip">Status: <span id="statusChip">Not saved</span></div>
    <div class="chip" id="modeChip">Mode: Standard</div>
  </div>

  <div class="row" style="margin-top:10px">
    <div>
      <label for="testDate">Test Date</label>
      <input id="testDate" type="date" />
    </div>
    <div>
      <label for="tech">Technician</label>
      <input id="tech" type="text" placeholder="Name / initials" />
    </div>
  </div>

  <div>
    <label for="notes">Notes</label>
    <textarea id="notes" placeholder="General notes..."></textarea>
  </div>

  <div class="grid2">
    <div class="tableWrap">
      <div style="font-weight:900;margin-bottom:8px">Line Side</div>
      <div id="lineRows"></div>
      <div class="btnrow">
        <button class="btn" id="addLineRow" type="button">Add Line Row</button>
      </div>
    </div>

    <div class="tableWrap">
      <div style="font-weight:900;margin-bottom:8px">Load Side</div>
      <div id="loadRows"></div>
      <div class="btnrow">
        <button class="btn" id="addLoadRow" type="button">Add Load Row</button>
      </div>
    </div>
  </div>

  <div class="btnrow">
    <button class="btn" id="saveBtn" type="button">Save</button>
    <button class="btn secondary" id="resetBtn" type="button">Reset (Clear Fields)</button>
    <a class="btn secondary" id="backBtn" href="#">Back to Equipment</a>
  </div>

  <div style="margin-top:12px;opacity:.9;font-size:13px;line-height:1.35">
    This page saves locally now. “Save” also sets completion for the correct step ID so Equipment progress updates.
  </div>
</div>

<script>
(function(){
  const qs=new URLSearchParams(location.search);
  const eq=(qs.get('eq')||'').trim();
  const mode=(qs.get('mode')||'').trim().toLowerCase(); // "equipment" or blank

  const titleH1=document.getElementById('titleH1');
  const modeChip=document.getElementById('modeChip');
  const eqLabel=document.getElementById('eqLabel');
  const backBtn=document.getElementById('backBtn');
  const statusChip=document.getElementById('statusChip');

  eqLabel.textContent = eq ? `Equipment: ${eq}` : 'Missing equipment ID (eq)';
  backBtn.href = eq ? `equipment.html?eq=${encodeURIComponent(eq)}` : 'index.html';

  const isEquipmentMode = (mode === "equipment");
  if(isEquipmentMode){
    titleH1.textContent = "Equipment Megohmmeter Test (If Applicable)";
    modeChip.textContent = "Mode: Equipment (separate)";
  }else{
    modeChip.textContent = "Mode: Standard";
  }

  function stepKey(stepId){ return `nexus_${eq||'NO_EQ'}_step_${stepId}`; }

  // Standard Meg completion step:
  const STEP_STANDARD_MEG = "meg";

  // Separate RIF equipment meg test completion step:
  const STEP_EQUIP_MEG = "rif_meg_equipment";

  // Data keys (separate storage for equipment mode)
  const keyV2 = isEquipmentMode
    ? `nexus_${eq||'NO_EQ'}_meg_log_equipment_v2`
    : `nexus_${eq||'NO_EQ'}_meg_log_v2`;

  const keyV1 = isEquipmentMode
    ? `nexus_${eq||'NO_EQ'}_meg_log_equipment_v1`
    : `nexus_${eq||'NO_EQ'}_meg_log_v1`;

  const lineRowsEl=document.getElementById('lineRows');
  const loadRowsEl=document.getElementById('loadRows');
  const testDate=document.getElementById('testDate');
  const tech=document.getElementById('tech');
  const notes=document.getElementById('notes');

  function rowTemplate(v){
    const wrap=document.createElement('div');
    wrap.style.marginBottom='10px';
    wrap.innerHTML=`
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
        <input class="c" placeholder="Conductor" value="${(v?.conductor||'').replace(/"/g,'&quot;')}">
        <input class="p" placeholder="Phase" value="${(v?.phase||'').replace(/"/g,'&quot;')}">
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
        <input class="v" placeholder="Voltage" value="${(v?.voltage||'').replace(/"/g,'&quot;')}">
        <input class="r" placeholder="Reading" value="${(v?.reading||'').replace(/"/g,'&quot;')}">
      </div>
      <input class="m" placeholder="Comments" value="${(v?.comments||'').replace(/"/g,'&quot;')}">
      <div style="margin-top:8px;text-align:right">
        <button class="btn secondary rm" type="button" style="padding:8px 12px;font-size:12px">Remove</button>
      </div>
    `;
    wrap.querySelector('.rm').onclick=()=>{wrap.remove(); markDirty();};
    wrap.querySelectorAll('input').forEach(i=>i.addEventListener('input', markDirty));
    return wrap;
  }

  function readRows(el){
    return [...el.children].map(w=>{
      const c=w.querySelector('.c')?.value||'';
      const p=w.querySelector('.p')?.value||'';
      const v=w.querySelector('.v')?.value||'';
      const r=w.querySelector('.r')?.value||'';
      const m=w.querySelector('.m')?.value||'';
      return {conductor:c, phase:p, voltage:v, reading:r, comments:m};
    });
  }

  function collect(){
    return {
      testDate: testDate.value || "",
      tech: tech.value || "",
      notes: notes.value || "",
      lineRows: readRows(lineRowsEl),
      loadRows: readRows(loadRowsEl),
      meta: { updatedAt: new Date().toISOString() }
    };
  }

  function render(data){
    testDate.value = data?.testDate || "";
    tech.value = data?.tech || "";
    notes.value = data?.notes || "";

    lineRowsEl.innerHTML='';
    loadRowsEl.innerHTML='';
    const line = Array.isArray(data?.lineRows)?data.lineRows:[];
    const load = Array.isArray(data?.loadRows)?data.loadRows:[];
    (line.length?line:[...Array(5)].map(()=>({}))).forEach(r=>lineRowsEl.appendChild(rowTemplate(r)));
    (load.length?load:[...Array(5)].map(()=>({}))).forEach(r=>loadRowsEl.appendChild(rowTemplate(r)));
  }

  function loadSaved(){
    try{
      const raw=localStorage.getItem(keyV2) || localStorage.getItem(keyV1);
      if(!raw) return null;
      return JSON.parse(raw);
    }catch(e){ return null; }
  }

  function markDirty(){
    statusChip.textContent = 'Not saved';
  }

  async function save(){
    if(!eq){
      alert("Missing eq in URL. Use meg_log.html?eq=XXXX");
      return;
    }

    const data=collect();
    localStorage.setItem(keyV2, JSON.stringify(data));

    // IMPORTANT: set completion step correctly
    const stepId = isEquipmentMode ? STEP_EQUIP_MEG : STEP_STANDARD_MEG;
    localStorage.setItem(stepKey(stepId), "1");

    statusChip.innerHTML = '<span class="ok">Saved</span>';
  }

  function resetAll(){
    if(!confirm("Clear fields on this page? (Saved data remains until you Save again.)")) return;
    testDate.value="";
    tech.value="";
    notes.value="";
    render({lineRows:[{}, {}, {}, {}, {}], loadRows:[{}, {}, {}, {}, {}]});
    markDirty();
  }

  document.getElementById('addLineRow').onclick=()=>{lineRowsEl.appendChild(rowTemplate({})); markDirty();};
  document.getElementById('addLoadRow').onclick=()=>{loadRowsEl.appendChild(rowTemplate({})); markDirty();};
  document.getElementById('saveBtn').onclick=save;
  document.getElementById('resetBtn').onclick=resetAll;

  [testDate,tech,notes].forEach(el=>el.addEventListener('input', markDirty));

  const saved=loadSaved();
  if(saved) render(saved);
  else render({lineRows:[{}, {}, {}, {}, {}], loadRows:[{}, {}, {}, {}, {}]});
})();
</script>
</body>
</html>
